<p>很少聽表弟談起遊戲，那天才知道，原來我們喜歡的遊戲如此相似。</p>
<!-- more -->
<p>由 Switch 2，聊到重視故事的 RPG，再聊到 SLG。還有《軒轅劍三》和《軒轅劍三外傳：天之痕》。</p>
<p>說起這些遊戲，也想起小時候，想起成長。原來有些記憶，可以在和表弟談遊戲的時候再碰到。</p>
<p>疫情期間玩《薩爾達傳說：曠野之息》，它的開放世界和生態，讓我想到，生活也需要探索。</p>
<p>下次，又會傾到咩遊戲呢？</p>
