<p>一位女士、一位年長的公公，還有兩個孫兒。</p>
<!-- more -->
<p>我靜靜聽着他們說話。通宵打麻雀、雲吞、埋單，還有一些家常。</p>
<p>沒有甚麼特別的事情發生。只是在這些小小的對話裏，看到三代人相處的溫暖。</p>
<p>你們很幸福。</p>
